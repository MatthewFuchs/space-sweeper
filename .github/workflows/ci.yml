name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test (macOS, arm64)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Build
        run: scripts/ci.sh build

      - name: Unit tests
        run: scripts/ci.sh test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: build/TestResults.xcresult
          if-no-files-found: ignore

  release-build:
    name: Release build artifact
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - name: Build Release
        run: |
          xcodebuild -project SpaceSweeper.xcodeproj -scheme SpaceSweeper -configuration Release \
            -destination 'platform=macOS,arch=arm64' -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO build
          ditto -c -k --keepParent build/DerivedData/Build/Products/Release/SpaceSweeper.app SpaceSweeper.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SpaceSweeper-app
          path: SpaceSweeper.zip
