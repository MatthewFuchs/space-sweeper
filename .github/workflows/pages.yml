name: Website

# Publishes website/ to GitHub Pages (https://matthewfuchs.github.io/space-sweeper/), with privacy.html
# rendered from PRIVACY.md and the latest release's appcast.xml (Sparkle update feed) copied alongside.

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "PRIVACY.md"
      - "scripts/build-site.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build site
        run: python3 scripts/build-site.py --out _site

      - name: Add update feed from the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download --repo "${{ github.repository }}" --pattern appcast.xml --dir _site 2>/dev/null; then
            echo "Included appcast.xml from the latest release"
          else
            echo "No release yet; site published without appcast.xml"
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
